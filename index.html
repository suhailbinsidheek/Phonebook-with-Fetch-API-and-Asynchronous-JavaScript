<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Switchboard — Contacts</title>
    <meta name="description" content="A professional contact console built with HTML, Bootstrap 5.3, and JavaScript.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="directory-shell container my-4 my-md-5">

        <!-- MASTHEAD -->
        <header class="directory-masthead d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
            <div class="directory-wordmark">
                <span class="directory-wordmark__eyebrow"> <i class="fa-solid fa-address-card" ></i>Contact Console · Line 01</span>
                <h1 class="directory-wordmark__title">Switchboard</h1>
            </div>
            <div class="directory-toolbar d-flex gap-2 justify-content-center align-items-center">
                <div class="directory-view-toggle" role="group" aria-label="Switch view">
                    <button class="directory-view-toggle__btn is-active" id="listViewToggle" aria-label="List view">
                        <i class="fa fa-list"></i>
                    </button>
                    <button class="directory-view-toggle__btn" id="gridViewToggle" aria-label="Card view">
                        <i class="fa fa-grip"></i>
                    </button>
                </div>
                <button class="btn directory-btn-primary" id="newContactBtn">
                    <i class="fa fa-plus"></i> New contact
                </button>
            </div>
        </header>

        <!-- SEARCH -->
        <div class="directory-search mb-4">
            <i class="fa fa-search directory-search__icon"></i>
            <input type="text" id="directorySearch" class="form-control directory-search__input" placeholder="Search by name or phone number…">
        </div>

        <!-- LIST VIEW -->
        <div id="listViewPanel" class="directory-panel table-responsive">
            <table class="table directory-table align-middle mb-0">
                <thead>
                    <tr>
                        <th>Contact</th>
                        <th class="d-none d-md-table-cell">Email</th>
                        <th>Phone</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody id="directoryListBody"></tbody>
            </table>
        </div>

        <!-- GRID VIEW -->
        <div class="row d-none" id="gridViewPanel"></div>

    </div>

    <!-- CONTACT FORM MODAL -->
    <div class="modal fade" id="contactFormModal">
        <div class="modal-dialog">
            <div class="modal-content directory-modal">
                <div class="modal-header">
                    <h5 class="modal-title directory-modal__title" id="contactFormModalLabel">Contact card</h5>
                    <button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="directory-field-label" for="contactNameInput">Full name</label>
                        <input id="contactNameInput" class="form-control" placeholder="Jordan Blake">
                        <div class="invalid-feedback">Name is required.</div>
                    </div>
                    <div class="mb-3">
                        <label class="directory-field-label" for="contactEmailInput">Email</label>
                        <input id="contactEmailInput" class="form-control" placeholder="jordan@example.com">
                        <div class="invalid-feedback">Enter a valid email.</div>
                    </div>
                    <div class="mb-1">
                        <label class="directory-field-label" for="contactPhoneInput">Phone</label>
                        <input id="contactPhoneInput" class="form-control" placeholder="9876543210">
                        <div class="invalid-feedback">The phone number must have 10 digits.</div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn directory-btn-primary" id="saveContactBtn">Save</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="directory-footer" id="directoryFooter">
        <p>© 2026 Switchboard</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./script.js"></script>
</body>
</html>
